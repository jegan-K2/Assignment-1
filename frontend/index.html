<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showlix | Movie Ticket Booking</title>
    <meta name="description" content="Book your movie tickets easily on Showlix - Tamil Nadu's premier cinema booking platform.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🎬 Showlix</a>
        <nav class="nav-links">
            <a href="index.html" data-t="home">Home</a>
            <a href="mytickets.html" id="navTickets" style="display:none;" data-t="myTickets">My Tickets</a>
            <a href="admin.html" id="navAdmin" style="display:none;" data-t="admin">Admin</a>
            <a href="login.html" id="navLogin" data-t="login">Login</a>
            <a href="#" id="navLogout" style="display:none;" data-t="logout">Logout</a>
            <a href="#" id="langToggleBtn" style="font-size:0.85rem; opacity:0.8;">🌐</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1 data-t="heroTitle">Unlimited Movies, Blockbuster Entertainment</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" data-t-placeholder="searchPlaceholder" placeholder="Search for movies...">
                <button id="searchBtn" data-t="search">Search</button>
            </div>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title" data-t="trendingMovies">Trending Movies</h2>
        <div class="movies-grid" id="moviesGrid">
            <!-- Movies dynamically loaded here -->
        </div>
    </div>

    <footer class="site-footer">
        <span class="footer-brand">🎬 Showlix</span>
        <p>© 2026 Showlix. Tamil Nadu's Premier Cinema Booking Platform.</p>
    </footer>

    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMovies();
        });
    </script>
</body>
</html>

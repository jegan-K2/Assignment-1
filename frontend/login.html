<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Showlix</title>
    <meta name="description" content="Secure admin login for Showlix — Tamil Nadu's Premier Cinema Booking Platform.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ─── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:       #070d1a;
            --bg-card:       #0e1726;
            --bg-input:      #141f33;
            --border:        rgba(255,255,255,0.08);
            --border-focus:  rgba(225, 29, 72, 0.6);
            --primary:       #e11d48;
            --primary-dark:  #be123c;
            --primary-glow:  rgba(225,29,72,0.25);
            --text:          #f1f5f9;
            --text-muted:    #64748b;
            --text-sub:      #94a3b8;
            --success:       #22c55e;
            --error-bg:      rgba(239,68,68,0.12);
            --error-border:  rgba(239,68,68,0.4);
            --error-text:    #fca5a5;
            --radius:        14px;
            --shadow-card:   0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ─── Animated Gradient Background ────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%,  rgba(225,29,72,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 110%,  rgba(99,102,241,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 100% 80% at 50% 50%,  rgba(15,23,42,0.6) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── Floating Orbs ────────────────────────────────────────────────── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: float-orb 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(225,29,72,0.08), transparent);
            top: -10%; left: -5%;
        }
        .orb-2 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(99,102,241,0.07), transparent);
            bottom: -5%; right: -5%;
            animation-delay: -6s;
        }
        @keyframes float-orb {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(20px, 15px) scale(1.05); }
        }

        /* ─── Layout ───────────────────────────────────────────────────────── */
        .login-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
        }

        /* ─── Card ─────────────────────────────────────────────────────────── */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
            padding: 40px 36px;
            animation: card-enter 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes card-enter {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)   scale(1);    }
        }

        /* ─── Logo / Brand ─────────────────────────────────────────────────── */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 22px;
            box-shadow: 0 4px 20px var(--primary-glow);
            flex-shrink: 0;
        }
        .brand-text { line-height: 1.2; }
        .brand-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .brand-sub {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--primary);
        }

        /* ─── Headings ─────────────────────────────────────────────────────── */
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* ─── Form ─────────────────────────────────────────────────────────── */
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            pointer-events: none;
        }
        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9375rem;
            padding: 13px 44px 13px 42px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: #182035;
        }
        .form-input:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Password toggle button */
        .toggle-pwd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .toggle-pwd:hover { color: var(--text); }
        .toggle-pwd:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* ─── Error Box ────────────────────────────────────────────────────── */
        .error-box {
            display: none;
            align-items: flex-start;
            gap: 10px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 0.875rem;
            color: var(--error-text);
            line-height: 1.4;
            animation: fade-in 0.25s ease;
        }
        .error-icon { flex-shrink: 0; margin-top: 1px; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ─── Login Button ─────────────────────────────────────────────────── */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px var(--primary-glow);
            transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
            margin-top: 4px;
        }
        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px var(--primary-glow);
        }
        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 17px; height: 17px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Divider ──────────────────────────────────────────────────────── */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0 20px;
        }

        /* ─── Security Badge ───────────────────────────────────────────────── */
        .security-notice {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .security-notice svg { flex-shrink: 0; color: #22c55e; }

        /* ─── Shake animation ──────────────────────────────────────────────── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15%  { transform: translateX(-6px); }
            30%  { transform: translateX(6px); }
            45%  { transform: translateX(-4px); }
            60%  { transform: translateX(4px); }
            75%  { transform: translateX(-2px); }
            90%  { transform: translateX(2px); }
        }
        .shake-anim { animation: shake 0.55s cubic-bezier(.36,.07,.19,.97) both; }

        /* ─── Footer ───────────────────────────────────────────────────────── */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .login-footer a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-footer a:hover { color: var(--text); }

        /* ─── Responsive ───────────────────────────────────────────────────── */
        @media (max-width: 480px) {
            .login-card { padding: 30px 24px; }
        }
    </style>
</head>
<body>

    <!-- Decorative orbs -->
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <main class="login-page">
        <div class="login-card" role="main">

            <!-- Brand -->
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">🎬</div>
                <div class="brand-text">
                    <div class="brand-name">Showlix</div>
                    <div class="brand-sub">Admin Portal</div>
                </div>
            </div>

            <!-- Headings -->
            <h1 class="login-title">Admin Sign In</h1>
            <p class="login-subtitle">Restricted access. Only authorized administrators may proceed.</p>

            <!-- Error message box -->
            <div id="loginError" class="error-box" aria-live="assertive">
                <span class="error-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </span>
                <span id="loginErrorText"></span>
            </div>

            <!-- Login Form -->
            <form id="adminLoginForm" novalidate autocomplete="off">

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            class="form-input"
                            placeholder="admin@example.com"
                            autocomplete="email"
                            required
                            aria-required="true"
                            aria-describedby="loginError"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            class="form-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            aria-required="true"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-pwd"
                            aria-label="Show password"
                            title="Toggle password visibility"
                        >
                            <!-- Eye icon (show) -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="btnSpinner" class="spinner" aria-hidden="true"></span>
                    <span id="btnText">Login</span>
                </button>

            </form>

            <hr class="divider">

            <!-- Security notice -->
            <div class="security-notice" role="note" aria-label="Security information">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>All authentication is verified server-side. Credentials are never stored in plain text.</span>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="login-footer">
        <p>© 2026 Showlix &nbsp;·&nbsp; <a href="index.html">Back to site</a></p>
    </footer>

    <!-- Dedicated admin login script — no other scripts needed on this page -->
    <script src="js/admin-login.js"></script>
</body>
</html>

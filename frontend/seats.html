<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Seats | Showlix</title>
    <meta name="description" content="Select your preferred seats for the movie.">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Showlix</a>
        <nav class="nav-links">
            <a href="index.html" data-t="home">Home</a>
            <a href="#" id="langToggleBtn" style="font-size:0.85rem; opacity:0.8;">🌐</a>
        </nav>
    </header>

    <div class="container">
        <div id="seatMovieHeader" style="display:flex; gap:20px; align-items:center; margin-bottom:30px; background:var(--card-bg); padding:20px; border-radius:15px; border:1px solid var(--border-subtle);">
            <img id="seatMoviePoster" src="" alt="Movie" style="width:80px; border-radius:10px;">
            <div>
                <h3 id="seatMovieTitle">Movie Title</h3>
                <p id="seatTheatreInfo" style="color:var(--primary); font-size:0.9rem; font-weight:600;"></p>
            </div>
        </div>

        <div class="seats-container">
            <div class="screen" data-t="screenThisWay">SCREEN THIS WAY</div>
            <div id="seatGrid">
                <!-- Seats generated by JS -->
            </div>
        </div>

        <div class="booking-summary">
            <h3 data-t="bookingSummary">Booking Summary</h3>
            <p><span data-t="seatsSelected">Seats Selected</span>: <span id="selectedSeatsList">None</span></p>
            <p><span data-t="totalPrice">Total Price</span>: ₹<span id="totalPrice">0</span></p>
            <button class="btn mt-20" id="confirmBookingBtn" data-t="confirmBooking">Confirm Booking</button>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            generateSeats();
        });
    </script>
</body>
</html>

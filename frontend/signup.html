<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Showlix</title>
    <meta name="description" content="Create a new Showlix account to start booking movie tickets.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🎬 Showlix</a>
        <nav class="nav-links">
            <a href="index.html" data-t="home">Home</a>
            <a href="#" id="langToggleBtn" style="font-size:0.85rem; opacity:0.8;">🌐</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2 data-t="signupTitle">Create an Account</h2>
        <form id="signupForm">
            <div class="form-group">
                <label data-t="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label data-t="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" data-t="signupBtn">Sign Up</button>
        </form>
        <div class="auth-link">
            <span data-t="haveAccount">Already have an account?</span> <a href="login.html" data-t="login">Login</a>
        </div>
    </div>

    <footer class="site-footer">
        <span class="footer-brand">🎬 Showlix</span>
        <p>© 2026 Showlix. Tamil Nadu's Premier Cinema Booking Platform.</p>
    </footer>

    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
